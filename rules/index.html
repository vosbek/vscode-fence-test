<!doctype html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-vEomt3ZeRZ0KtD5QpRTRmQc7MlajK/nCysYESgw20UI='; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rules</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* The rules workbench, laid out like a desktop tool: a navy sidebar of sections, a page header that says what the section
   is for, the work area, and a status bar. colour carries meaning (red blocks, amber warns, green is
   fixed or done, blue is you and accepted). Always light. Design: Claude Design canvas "Local Rules View", row D. */
:root{
  --navy:#0a2753;--navy-2:#123676;--navy-ink:#dfe7f6;--navy-muted:#8ea4cf;--navy-line:rgba(255,255,255,.09);
  --blue:#0047bb;--blue-hover:#003a99;--blue-tint:#eef3fc;--blue-line:#d6e2f7;
  --red:#b42318;--red-dot:#d92d20;--red-tint:#fdecea;
  --amber:#8a5a00;--amber-dot:#e3a008;--amber-tint:#fdf3dc;
  --green:#1b6e3c;--green-dot:#2f9e5b;--green-tint:#e4f4e8;
  --violet:#5b3ba8;--violet-tint:#f2edfb;--teal:#155e75;--teal-tint:#e6f2f6;
  --ink:#121722;--ink-2:#3f4756;--muted:#667085;--faint:#98a1b0;
  --line:#e3e7ee;--line-2:#eef1f5;--field:#c9d3e3;--canvas:#f5f7fa;--panel:#ffffff;
  --mono:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,Menlo,monospace;
  --sans:Inter,'Segoe UI Variable','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--canvas);color:var(--ink)}
body{font:13px/20px var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;color:inherit;cursor:pointer}button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
code,.mono{font-family:var(--mono);font-size:12px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:14px;height:14px}

.app{height:100vh;display:grid;grid-template-columns:232px minmax(0,1fr);grid-template-rows:minmax(0,1fr) 26px}
/* sidebar */
.side-nav{grid-row:1/3;display:flex;flex-direction:column;background:var(--navy);color:var(--navy-ink);min-height:0}
.brand{padding:16px 18px 14px;border-bottom:1px solid var(--navy-line)}
.brand .app-name{display:flex;align-items:center;gap:10px;color:#fff;font-weight:600;font-size:14px}
.brand .repo{margin-top:12px;color:#fff;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .ref{font-family:var(--mono);font-size:11.5px;color:var(--navy-muted)}
.nav{flex:1;overflow:auto;padding:6px 10px 10px}
.nav .grp{padding:14px 8px 4px;font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--navy-muted)}
.nav a{display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border-radius:6px;color:var(--navy-ink);text-decoration:none}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a[aria-current="page"]{background:#fff;color:var(--navy);font-weight:600}
.nav a .lab{flex:1}
.nav a .n{min-width:20px;height:18px;padding:0 6px;border-radius:9px;font-size:11px;font-weight:600;line-height:18px;text-align:center;background:rgba(255,255,255,.12);color:#fff}
.nav a .n.zero{background:transparent;color:var(--navy-muted);font-weight:500}
.nav a[aria-current="page"] .n{background:var(--blue);color:#fff}.nav a[aria-current="page"] .n.zero{background:transparent;color:var(--muted)}
.nav a .n.todo{background:#f0b429;color:#3d2a00}
.who{display:flex;align-items:center;gap:8px;padding:12px 18px;border-top:1px solid var(--navy-line);font-size:12px;color:var(--navy-muted)}
.who .dot{width:7px;height:7px;border-radius:4px;background:#4cc38a}.who .dot.off{background:#f0b429}
/* main */
.main{grid-column:2;grid-row:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.page-head{flex:none;display:flex;align-items:flex-start;gap:16px;padding:18px 24px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.page-head .t{flex:1;min-width:0}
.page-head h1{margin:0;display:flex;align-items:center;gap:10px;font-size:19px;line-height:28px;font-weight:600}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:11px;background:var(--line-2);color:var(--ink-2);font-size:12px;font-weight:600}
.page-head p{margin:2px 0 0;max-width:96ch;color:var(--ink-2);font-size:13.5px;line-height:21px}
.story{flex:none;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin:0;padding:10px 24px;background:var(--panel);border-bottom:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.story .lbl{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.story b{color:var(--ink);font-weight:600}.story code{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.story .sep{color:var(--muted)}.story .st.now b{color:var(--blue)}
.work{flex:1;min-height:0;display:flex}
.statusbar{grid-column:2;grid-row:2;display:flex;align-items:center;gap:16px;padding:0 14px;background:#eef1f6;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden}
.statusbar .sep{width:1px;height:12px;background:var(--line)}
.statusbar .live{display:inline-flex;align-items:center;gap:6px}.statusbar .live i{width:6px;height:6px;border-radius:3px;background:var(--green-dot)}

/* proposed: list */
.list{flex:0 0 330px;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);min-width:0}
.list-tools{flex:none;display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.search{display:flex;align-items:center;gap:6px;height:30px;padding:0 8px;border:1px solid var(--line);border-radius:6px;color:var(--muted);background:var(--panel)}
.search:focus-within{border-color:var(--field)}
.search input{flex:1;min-width:0;border:0;outline:0;font:inherit;background:transparent;color:var(--ink)}
.kbd{font-family:var(--mono);font-size:10.5px;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:0 4px;line-height:16px}
.filters{display:flex;gap:6px}
.filters button{height:24px;padding:0 10px;border:1px solid var(--line);border-radius:12px;background:var(--panel);font-size:12px;font-weight:500;color:var(--ink-2)}
.filters button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.filters button.b[aria-pressed="false"]{color:var(--red)}.filters button.w[aria-pressed="false"]{color:var(--amber)}
.rows{flex:1;overflow:auto;margin:0;padding:0;list-style:none}
.row{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:2px 10px;align-items:center;width:100%;padding:10px 14px;border:0;border-bottom:1px solid var(--line-2);background:var(--panel);text-align:left}
.row:hover{background:#f8fafd}
.row[aria-current="true"]{background:var(--blue-tint);box-shadow:inset 3px 0 0 var(--blue)}
.row .dot{width:8px;height:8px;border-radius:4px}.row .dot.block{background:var(--red-dot)}.row .dot.warn{background:var(--amber-dot)}.row .dot.info{background:var(--faint)}
.row .id{font-family:var(--mono);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .right{font-size:11.5px;color:var(--muted)}
.row .desc{grid-column:2/4;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{display:inline-flex;align-items:center;gap:4px;font-weight:600}.st.accept{color:var(--blue)}.st.reject{color:var(--ink-2)}.st.pr{color:var(--blue)}
.list-foot{flex:none;padding:8px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}

/* proposed: detail */
.detail{flex:1;min-width:0;overflow:auto}
.detail-inner{max-width:820px;padding:22px 26px 40px;display:flex;flex-direction:column;gap:16px}
.head h1{margin:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:17px;line-height:26px;font-weight:500}
.head p{margin:6px 0 0;font-size:14px;line-height:22px;max-width:72ch}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:11px;font-family:var(--sans);font-size:12px;font-weight:600;white-space:nowrap}
.pill.block{background:var(--red-tint);color:var(--red)}.pill.warn{background:var(--amber-tint);color:var(--amber)}.pill.info{background:var(--line-2);color:var(--ink-2)}
.pill.green{background:var(--green-tint);color:var(--green)}.pill.grey{background:var(--line-2);color:var(--ink-2)}.pill.blue{background:var(--blue-tint);color:var(--blue)}
.pill.violet{background:var(--violet-tint);color:var(--violet)}.pill.teal{background:var(--teal-tint);color:var(--teal)}.pill.off{background:var(--canvas);color:var(--faint)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.lbl{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.card .v{margin-top:4px}
.why{padding:14px 16px;background:var(--blue-tint);border:1px solid var(--blue-line);border-radius:8px}
.why .lbl{color:var(--blue)}
.why p{margin:6px 0 0}
.meter{margin-top:12px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.meter .m{flex:1;min-width:240px}
.meter .m .row2{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2)}
.bar{margin-top:6px;height:8px;border-radius:4px;background:var(--blue-line);overflow:hidden}.bar i{display:block;height:100%}
.bar i.block{background:var(--red-dot)}.bar i.warn{background:var(--amber-dot)}
.meter .f{font-size:12px;color:var(--ink-2)}
.verdict{margin:10px 0 0;font-weight:500}
.examples{margin:8px 0 0;padding:0;list-style:none;font-size:12.5px}.examples li{display:flex;gap:10px;padding:4px 0;border-top:1px solid var(--blue-line)}
.decision{padding:14px 16px;background:var(--panel);border:1px solid var(--field);border-radius:8px;box-shadow:0 1px 2px rgba(10,39,83,.06)}
.decision textarea{display:block;width:100%;min-height:62px;margin-top:8px;padding:9px 11px;border:1px solid var(--field);border-radius:6px;font:inherit;resize:vertical;color:var(--ink);background:var(--panel)}
.decision textarea::placeholder{color:var(--faint)}
.decision textarea:disabled{background:var(--canvas)}
.decision .bar2{display:flex;align-items:center;gap:8px;margin-top:10px}
.decision .hint{color:var(--faint);font-size:12px}
.decision.done{display:flex;align-items:flex-start;gap:12px;background:var(--canvas);box-shadow:none;border-color:var(--line)}
.decision.done .w{flex:1}.decision.done .r{margin-top:2px;color:var(--ink-2)}
.copy{display:flex;align-items:center;gap:8px;margin-top:8px}.copy code{flex:1;min-width:0;padding:6px 10px;background:var(--canvas);border:1px solid var(--line);border-radius:6px;overflow-x:auto;white-space:nowrap}
details.def{background:var(--panel);border:1px solid var(--line);border-radius:8px}
details.def summary{cursor:pointer;padding:10px 14px;list-style:none;display:flex;align-items:center;gap:8px}
details.def summary::-webkit-details-marker{display:none}
details.def[open] summary{border-bottom:1px solid var(--line)}
details.def pre{margin:0;padding:12px 14px;font:12px/18px var(--mono);color:var(--ink-2);overflow-x:auto}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 14px;border:1px solid var(--field);border-radius:6px;background:var(--panel);font-weight:500;white-space:nowrap}
.btn:hover:not(:disabled){background:#f3f6fa}
.btn:disabled{color:var(--faint);border-color:var(--line)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.btn.primary:hover:not(:disabled){background:var(--blue-hover)}
.btn.primary:disabled{background:var(--line);border-color:var(--line);color:var(--faint)}
.btn.link{border:0;background:none;height:auto;padding:0;color:var(--muted);font-weight:400}.btn.link:hover:not(:disabled){background:none;color:var(--ink);text-decoration:underline}
.btn.wide{width:100%;height:36px}

/* proposed: your decisions */
.mine{flex:0 0 280px;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);min-width:0}
.mine-head{flex:none;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600}
.mine-body{flex:1;overflow:auto;padding:10px 16px 16px;display:flex;flex-direction:column;gap:2px}
.placeholder{padding:12px;border:1px dashed var(--field);border-radius:8px;color:var(--muted)}
.change{padding:10px 0;border-bottom:1px solid var(--line-2)}
.change .l1{display:flex;align-items:center;gap:8px}.change .l1 .mono{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.change .r{margin-top:4px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.files{margin-top:10px;color:var(--muted);font-size:12px}.files div{font-family:var(--mono)}
.alert{margin:6px 0;padding:8px 10px;border-radius:6px;background:var(--red-tint);color:var(--red)}
.ok{margin:6px 0;padding:8px 10px;border-radius:6px;background:var(--green-tint);color:var(--green)}
.prs{margin-top:14px}.prs .lbl{margin-bottom:4px}
.mine-foot{flex:none;padding:12px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:8px}
.mine-foot .small{color:var(--muted);font-size:12px}

/* other sections */
.page{flex:1;overflow:auto}.page-inner{max-width:1160px;padding:20px 24px 40px;display:flex;flex-direction:column;gap:14px}
.table{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.table table{width:100%;border-collapse:collapse}
.table th{position:sticky;top:0;height:36px;padding:0 14px;text-align:left;background:#f0f4fa;border-bottom:1px solid var(--line);font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.table td{padding:11px 14px;border-bottom:1px solid var(--line-2);vertical-align:top}
.table tr:last-child td{border-bottom:0}
.table tbody tr:hover td{background:#fafbfd}
.table .sub{margin-top:2px;color:var(--muted);font-size:12px}
.note{margin:0;color:var(--muted);max-width:96ch}
.empty{display:flex;gap:14px;align-items:flex-start;padding:22px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.empty .ic{flex:none;display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:20px;background:var(--blue-tint);color:var(--blue)}
.empty b{display:block;font-size:14px;margin-bottom:2px}.empty p{margin:0;color:var(--ink-2);max-width:80ch}
.progress{padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.progress .row3{display:flex;justify-content:space-between;font-weight:600}.progress .row3 span:last-child{font-weight:400;color:var(--muted)}
.progress .bar{background:var(--line)}.progress .bar i{background:var(--blue)}
.checklist{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.checklist .it{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;border-bottom:1px solid var(--line-2)}
.checklist .it:last-child{border-bottom:0}
.tick{flex:none;display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:10px;border:2px solid var(--field);color:#fff}
.tick.done{background:var(--green-dot);border-color:var(--green-dot)}
.checklist .tx{flex:1}.checklist .done-t{color:var(--muted);text-decoration:line-through}
.checklist .sub{margin-top:2px;color:var(--muted);font-size:12px}
.diagram-card{padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:10px}

/* dialog */
.scrim{position:fixed;inset:0;background:rgba(10,23,45,.38);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.dialog{width:660px;max-width:100%;max-height:calc(100vh - 32px);display:flex;flex-direction:column;background:var(--panel);border-radius:10px;box-shadow:0 24px 48px rgba(10,23,45,.28)}
.dialog header{padding:16px 20px 0}.dialog h2{margin:0;font-size:15px;font-weight:600}.dialog .sub{margin-top:2px;color:var(--muted)}
.dialog .body{padding:14px 20px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.dialog label,.dialog .lab{display:block;margin-bottom:4px;font-size:12px;font-weight:600;color:var(--ink-2)}
.dialog input{width:100%;height:32px;padding:0 10px;border:1px solid var(--field);border-radius:6px;font:12.5px var(--mono);color:var(--ink)}
.dialog pre{margin:0;padding:10px 12px;max-height:180px;overflow:auto;background:var(--canvas);border:1px solid var(--line);border-radius:6px;font:12px/18px var(--mono);white-space:pre-wrap;color:var(--ink-2)}
.dialog pre .add{color:var(--green)}.dialog pre .del{color:var(--red)}
.dialog footer{padding:12px 20px 16px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line)}

/* How it works (rules_model.py) */
.sf-block{margin-bottom:28px}.sf-h2{font-size:14px;font-weight:600;margin:0 0 4px}
.sf-lede{color:var(--ink-2);max-width:90ch;margin:0 0 12px}.sf-cap{font-size:12px;color:var(--muted);margin:6px 0 0}
.sf-diagram{overflow-x:auto;border:1px solid var(--line);border-radius:8px;padding:12px;background:#fff}.sf-diagram svg{display:block;max-width:none}
@media (min-width:1400px){.sf-diagram svg{width:100%;height:auto}.sf-cap{display:none}}
.sf-d-lane{fill:var(--canvas)}.sf-d-col{font-size:13px;font-weight:600;fill:var(--muted)}
.sf-d-box{fill:#fff;stroke:var(--field);stroke-width:1}.sf-d-box--decide{fill:var(--blue);stroke:var(--blue)}.sf-d-box--person{fill:#fff;stroke:var(--navy);stroke-width:1.6}
.sf-d-t{font-size:12.5px;fill:var(--ink-2)}.sf-d-tb{font-size:13px;font-weight:600;fill:var(--ink)}.sf-d-t--on{fill:#fff}.sf-d-muted{fill:var(--muted)}
.sf-d-label{font-size:12px;fill:var(--muted)}.sf-d-arrow{fill:none;stroke:var(--muted);stroke-width:1.3}.sf-d-arrow--dashed{stroke-dasharray:5 4}.sf-d-head{fill:var(--muted)}
.sf-id{font-family:var(--mono);font-size:12px}.sf-list{margin:0;padding-left:18px;line-height:1.7;max-width:90ch}
.sf-block .table, .sf-block table{width:100%}
.sf-block table{border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:8px}
.sf-block th{padding:8px 12px;text-align:left;background:#f0f4fa;font-size:12px;color:var(--ink-2)}.sf-block td{padding:8px 12px;border-top:1px solid var(--line-2);vertical-align:top}

@media (max-width:1180px){.mine{flex-basis:250px}.list{flex-basis:290px}}
@media (max-width:900px){
  .app{display:block;height:auto}.side-nav{display:block}.brand{display:flex;align-items:baseline;gap:12px;padding:12px 16px}.brand .repo{margin:0}
  .nav{display:flex;overflow-x:auto;gap:4px;padding:6px 10px}.nav .grp{display:none}.nav a{flex:none}.who{display:none}
  .work{display:block}.list,.mine{border:0;border-bottom:1px solid var(--line)}.rows,.detail,.mine-body,.page{overflow:visible}
  .cards{grid-template-columns:1fr}.detail-inner,.page-inner{padding:16px}.statusbar{display:none}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<script>
(function () {
  "use strict";

ar)\"/\u003e\u003crect class=\"sf-d-box sf-d-box--decide\" x=\"940\" y=\"10\" width=\"210\" height=\"96\"/\u003e\u003ctext class=\"sf-d-tb sf-d-t--on\" x=\"952\" y=\"32\"\u003eIn force\u003c/text\u003e\u003ctext class=\"sf-d-t sf-d-t--on\" x=\"952\" y=\"49\"\u003eedit hook, Stop hook,\u003c/text\u003e\u003ctext class=\"sf-d-t sf-d-t--on\" x=\"952\" y=\"66\"\u003epre-commit and CI all\u003c/text\u003e\u003ctext class=\"sf-d-t sf-d-t--on\" x=\"952\" y=\"83\"\u003echeck it on every change\u003c/text\u003e\u003cpath class=\"sf-d-arrow\" d=\"M916 58 H936\" marker-end=\"url(#sf-ar)\"/\u003e\u003ctext class=\"sf-d-t sf-d-muted\" x=\"4\" y=\"140\"\u003eRejected rules are remembered, so they are not proposed again.\u003c/text\u003e\u003ctext class=\"sf-d-t sf-d-muted\" x=\"4\" y=\"160\"\u003eAn exception lets one file break one rule for a while: it needs a reason, a named approver and an expiry date,\u003c/text\u003e\u003ctext class=\"sf-d-t sf-d-muted\" x=\"4\" y=\"180\"\u003eand the fence fails the day it expires. Agents cannot edit the rule files; CODEOWNERS sends every change to them to a person.\u003c/text\u003e\u003c/svg\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"sf-block\"\u003e\u003ch2 class=\"sf-h2\"\u003eWhat nothing here checks\u003c/h2\u003e\u003cul class=\"sf-list\"\u003e\u003cli\u003eNo check starts the application and uses it. Behaviour is covered by the repository\u0026#x27;s tests and the hidden tests only.\u003c/li\u003e\u003cli\u003eNo guard rule is in force yet, so architecture is not enforced: an import that breaks the layers passes the fence.\u003c/li\u003e\u003cli\u003eHidden tests run on a pull request only when the HIDDEN_TESTS_TOKEN secret is set; without it the job passes without running them.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e", "inForce": [], "judgment": [], "mode": "published", "openPrs": [], "owners": {"file": ".github/CODEOWNERS", "rows": [{"owners": "@hediet @alexdima @lszomoru", "path": ".github/workflows/monaco-editor     h.push('<div class="cards"><div class="card"><div class="lbl">What it stops</div><div class="v">' + esc(r.stops || "Changes that break what it requires.") + '</div></div><div class="card"><div class="lbl">When it is checked</div><div class="v">' + esc(where(r.enforcedBy)) + "</div></div></div>");
    var f = num(r.fired), c = num(r.commits), pct = f && c ? Math.max(2, Math.round(f / c * 100)) : 0;
    var from = r.source === "learned" ? "Found in the repository’s past mistakes" : "Suggested from the codebase map and history";
    h.push('<div class="why"><div class="lbl">Why it was suggested</div><p>' + esc(r.why || from + ".") + "</p>");
    if (r.replayable && c !== null) {
      var fixed = (r.evidence || []).filter(function (e) { return /^Of those/.test(e[0]); })[0], base = (r.evidence || []).filter(function (e) { return /all commits$/.test(e[0]); })[0];
      h.push('<div class="meter"><div class="m"><div class="row2"><span>Tested on the last ' + c + ' commits</span><span class="num">Would have flagged ' + f + '</span></div><div class="bar"><i class="' + sevClass(r.severity) + '" style="width:' + pct + '%"></i></div></div>'
        + (f && base ? '<div class="f num">Across all commits, ' + esc(base[1]) + " needed a fix</div>" : "") + "</div>");
    }
    h.push('<p class="verdict">' + esc(r.reading) + "</p>");
    if (r.examples && r.examples.length) h.push('<ul class="examples">' + r.examples.map(function (x) { return "<li><code>" + esc((x.sha || "").slice(0, 9)) + "</code><span>" + esc(x.subject || "") + "</span></li>"; }).join("") + "</ul>");
    h.push('<div class="w" style="margin-top:8px;font-size:12px;color:var(--muted)">' + esc(from) + (r.added ? ", " + esc(day(r.added)) : "") + ".</div></div>");
    h.push(decisionBox(r));
    h.push('<details class="def"><summary>' + icon("code", "sm") + '<span class="lbl" style="color:var(--ink-2)">Rule definition</span></summary><pre>' + esc(r.definition) + "</pre></details>");
    h.push("</div>");
    return h.join("");
  }

  function decisionBox(r) {
    if (!LOCAL) return '<div class="decision"><div class="lbl">Your decision</div><div style="margin-top:6px;color:var(--ink-2)">Decide from a checkout of the repository. It opens this screen with Accept and Reject:</div><div class="copy"><code id="cmd">python3 .cartographer/bin/guard.py --serve</code><button type="button" class="btn" data-copy="cmd">Copy</button></div></div>';
    if (r.pr) return '<div class="decision done"><span class="st pr">' + icon("pr") + '</span><div class="w"><b>' + (r.pr.decision === "accept" ? "Accepted" : "Rejected") + '</b> in <a href="' + esc(url(r.pr.url)) + '" target="_blank" rel="noopener">' + esc(url(r.pr.url).replace(/^https:\/\/github\.com\/[^/]+\/[^/]+\/pull\//, "pull request #")) + '</a><div class="r">In force once the code owner merges it.</div></div></div>';
    if (r.pending) return '<div class="decision done"><span class="st ' + r.pending.decision + '">' + icon(r.pending.decision) + '</span><div class="w"><b>' + (r.pending.decision === "accept" ? "Accepted" : "Rejected") + '</b> in your checkout, not committed<div class="r">' + esc(r.pending.why) + '</div></div><button type="button" class="btn link" data-undo="' + esc(r.id) + '">Undo</button></div>';
    var blocked = S.stray && S.stray.length, can = (ui.why[r.id] || "").trim() && !ui.busy && !blocked;
    return '<div class="decision"><label class="lbl" for="why">Your decision</label><textarea id="why" placeholder="Why you accept or reject it (required). It is recorded with the rule and in the pull request."' + (blocked ? " disabled" : "") + ">" + esc(ui.why[r.id] || "") + "</textarea>"
      + '<div class="bar2"><span class="hint">A to accept, R to reject</span><span style="flex:1"></span><button type="button" class="btn" data-act="reject"' + (can ? "" : " disabled") + '>Reject</button><button type="button" class="btn primary" data-act="accept"' + (can ? "" : " disabled") + ">Accept</button></div></div>";
  }

  function mineView() {
    var n = S.pending.length, h = ['<aside class="mine" aria-label="Your decisions"><div class="mine-head">Your decisions' + (n ? ' <span class="chip num">' + n + "</span>" : "") + '</div><div class="mine-body">'];
    (S.stray || []).forEach(function (m) { h.push('<div class="alert" role="alert">' + esc(m) + "</div>"); });
    if (ui.error && !ui.dialog) h.push('<div class="alert" role="alert">' + esc(ui.error) + "</div>");
    if (ui.done) h.push('<div class="ok" role="status">Pull request opened: <a href="' + esc(url(ui.done.url)) + '" target="_blank" rel="noopener">' + esc(url(ui.done.url).replace(/^https:\/\/github\.com\//, "")) + "</a></div>");
    if (!n && !ui.done) h.push('<div class="placeholder">Decisions you make collect here. One pull request carries them all, committed as you.</div>');
    S.pending.forEach(function (d) {
      h.push('<div class="change"><div class="l1"><span class="st ' + d.decision + '">' + icon(d.decision, "sm") + '</span><span class="mono">' + esc(d.id) + '</span><button type="button" class="btn link" data-undo="' + esc(d.id) + '" aria-label="Undo the decision on ' + esc(d.id) + '">Undo</button></div><div class="r">' + esc(d.why) + "</div></div>");
    });
    if (n) h.push('<div class="files" title="In .cartographer/"><div>M guardrails.json</div><div>M guardrails.proposed.json</div></div>');
    if (S.openPrs && S.openPrs.length) {
      h.push('<div class="prs"><div class="lbl">Open pull requests</div>');
      S.openPrs.forEach(function (p) { h.push('<div><a href="' + esc(url(p.url)) + '" target="_blank" rel="noopener">' + esc(p.title) + "</a></div>"); });
      h.push("</div>");
    }
    h.push('</div><div class="mine-foot"><button type="button" class="btn primary wide" data-act="dialog"' + (n && !ui.busy ? "" : " disabled") + ">Open pull request…</button>");
    if (n) h.push('<button type="button" class="btn link" data-act="discard">' + (ui.confirmDiscard ? "Discard " + plural(n, "decision", "decisions") + "?" : "Discard") + "</button>");
    if (S.repo.ruleOwners) h.push('<div class="small">Reviewed by ' + esc(S.repo.ruleOwners) + " (code owner)</div>");
    h.push("</div></aside>");
    return h.join("");
  }

  function publishedSide() {
    return '<aside class="mine" aria-label="How a rule is decided"><div class="mine-head">How a rule is decided</div><div class="mine-body" style="gap:10px;padding-top:12px">'
      + '<ol style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;color:var(--ink-2)"><li>A person runs <code>guard.py --serve</code> in a checkout.</li><li>They accept or reject each rule, with a reason.</li><li>One pull request, committed as them, carries the decisions.</li><li>' + (S.repo.ruleOwners ? esc(S.repo.ruleOwners) : "The rules’ code owner") + " reviews and merges it; then the rules are in force.</li></ol>"
      + '<div class="placeholder" style="margin-top:6px">Agents cannot decide: their hooks refuse edits to the rule files and the commands that apply a decision.</div></div></aside>';
  }

  function diffHtml(d) {
    return esc(d || "").split("\n").map(function (l) { return /^\+(?!\+\+)/.test(l) ? '<span class="add">' + l + "</span>" : /^-(?!--)/.test(l) ? '<span class="del">' + l + "</span>" : l; }).join("\n");
  }
  function dialogView() {
    var d = ui.dialog;
    return '<div class="scrim"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-t"><header><h2 id="dlg-t">Open pull request</h2><div class="sub">' + esc(d.title) + '</div></header><div class="body">'
      + (ui.error ? '<div class="alert" role="alert" style="margin:0">' + esc(ui.error) + "</div>" : "")
      + '<div><label for="branch">Branch</label><input id="branch" value="' + esc(d.branch) + '"' + (ui.busy ? " disabled" : "") + "></div>"
      + '<div><span class="lab">Changes</span><pre>' + diffHtml(d.diff) + "</pre></div>"
      + '<div><span class="lab">Description</span><pre>' + esc(d.body) + "</pre></div>"
      + '<div style="color:var(--muted)">Commits only the two rule files, as you, from HEAD. Opened with your GitHub login' + (S.repo.ruleOwners ? " for " + esc(S.repo.ruleOwners) + " to review" : "") + ".</div></div>"
      + '<footer><button type="button" class="btn" data-act="cancel"' + (ui.busy ? " disabled" : "") + '>Cancel</button><button type="button" class="btn primary" data-act="open"' + (ui.busy ? " disabled" : "") + ">" + (ui.busy ? "Opening…" : "Commit and open") + "</button></footer></div></div>";
  }

  function empty(ic, title, text) { return '<div class="empty"><span class="ic">' + icon(ic) + "</span><div><b>" + title + "</b><p>" + text + "</p></div></div>"; }
  function table(head, rows) {
    return '<div class="table"><table><thead><tr>' + head.map(function (x) { return "<th>" + x + "</th>"; }).join("") + "</tr></thead><tbody>" + rows.map(function (r) { return "<tr>" + r.map(function (c) { return "<td>" + c + "</td>"; }).join("") + "</tr>"; }).join("") + "</tbody></table></div>";
  }
  function sub(t) { return t ? '<div class="sub">' + t + "</div>" : ""; }
  var KIND = { security: "teal", tests: "blue", style: "violet", practices: "violet", patterns: "warn", structure: "grey", performance: "grey", database: "grey" };
  var CONTROLS = { ".cartographer/guardrails.json": "The rules in force", ".cartographer/baseline.json": "Today’s structural-debt counts", ".cartographer/hooks/": "The agent hooks", ".fence/": "The fence and its settings",
                   ".github/workflows/fence.yml": "The fence in CI", ".github/workflows/gardener.yml": "The gardener", ".github/workflows/hidden-tests.yml": "The hidden tests", ".github/workflows/rules-page.yml": "The published rules page", ".github/CODEOWNERS": "Who approves what", "verification/": "The formal models" };

  function otherView(v) {
    if (v === "in-force") {
      if (!S.inForce.length) return empty("shield", "No rules in force yet", "When a person accepts a proposed rule and the pull request merges, it appears here with who decided and why. " + plural(S.waiting.length, "rule is", "rules are") + ' <a href="#waiting">waiting for a decision</a>.');
      return table(["Rule", "What it requires", "Effect", "Decided"], S.inForce.map(function (r) {
        var d = r.decided || {};
        return ['<span class="mono">' + esc(r.id) + "</span>", esc(r.description) + sub(esc(where(r.enforcedBy))) + (r.fix ? sub("If it fails: " + esc(r.fix)) : ""), pill(effect(r.severity), sevClass(r.severity)),
                (d.by || d.on ? esc([d.by, day(d.on)].filter(Boolean).join(", ")) + sub(esc(d.why || "")) : '<span style="color:var(--muted)">Not recorded</span>')];
      })) + '<p class="note">To change or remove a rule in force, a person edits <code>.cartographer/guardrails.json</code> in a pull request the code owner approves. Agents cannot edit it.</p>';
    }
    if (v === "rejected") {
      if (!S.rejected.length) return empty("xcircle", "No rejected rules", "A rule a person rejects appears here with the reason, and the factory does not suggest it again.");
      return table(["Rule", "Decided", "Reason"], S.rejected.map(function (r) { return ['<span class="mono">' + esc(r.id) + "</span>", esc([r.by, day(r.on)].filter(Boolean).join(", ")), esc(r.why || "")]; }));
    }
    if (v === "exceptions") {
      if (!S.exceptions.length) return empty("clock", "No exceptions", "Nothing in this repository is excused from a rule or a check. A person adds one through /tend-fence, with a reason, an approver and an expiry; agents cannot.");
      return table(["Rule or check", "File", "Reason", "Approved by", "Expires"], S.exceptions.map(function (x) {
        return ['<span class="mono">' + esc(x.name) + "</span>" + sub(esc(x.kind)), '<span class="mono">' + esc(x.where) + "</span>", esc(x.reason), esc(x.by), '<span class="num">' + esc(day(x.expires)) + "</span>" + (x.expired ? " " + pill("Expired", "block") : "")];
      }));
    }
    if (v === "fence") {
      if (!S.hasFence) return empty("checks", "Not onboarded to the fence", "There is no <code>.fence/fence.json</code> in this repository.");
      if (!S.checksListed) return empty("checks", "Checks not listed", "<code>.fence/fence.json</code> does not list them: this repository’s fence defines them in its own code.");
      var withResult = S.checks.some(function (c) { return c.result; });
      var rows = S.checks.map(function (c) {
        var idle = /^Does nothing here|^Nothing to enforce/.test(c.note || "");
        var fail = idle ? pill("Not active", "off") + sub(esc(c.note)) : c.fixer ? pill("The gardener fixes it", "green") : pill("A person decides", "grey");
        var r = ['<span class="mono">' + esc(c.id) + "</span>", pill(c.category, KIND[c.category] || "grey"), esc(c.title), '<code style="color:var(--muted);word-break:break-word">' + esc(c.tool) + "</code>", fail];
        if (withResult) r.push(esc(c.result));
        return r;
      });
      var out = table(["Check", "Kind", "What it requires", "Tool", "When it fails"].concat(withResult ? ["Last result"] : []), rows)
        + '<p class="note">When a check fails, the gardener runs any fixer, runs every check again and commits only if nothing else broke. Anything it cannot fix is labelled for a person, who changes the code, the request or the check, or records an exception.</p>';
      if (S.deps.length) out += '<h2 style="margin:12px 0 0;font-size:14px">Approved dependencies</h2>' + table(["Package", "Reason", "Approved by"], S.deps.map(function (d) { return ['<span class="mono">' + esc(d.name) + "</span>", esc(d.reason), esc(d.by)]; }));
      return out;
    }
    if (v === "judgment") return table(["Rule", "Why a person checks it"], S.judgment.map(function (j) { return [esc(j.text), esc(j.why)]; }));
    if (v === "owners") {
      if (!S.owners.rows.length) return empty("users", "No owners for the rule files", "Without CODEOWNERS entries, anyone with write access, an agent included, can change the rules in a pull request.");
      var reviewOff = (S.setup || []).some(function (s) { return !s.done && /code owner review/i.test(s.text); });
      return table(["Path", "What it controls", "Approver"], S.owners.rows.map(function (o) { return ['<span class="mono">' + esc(o.path.replace(/^\//, "")) + "</span>", esc(CONTROLS[o.path.replace(/^\//, "")] || ""), esc(o.owners)]; }))
        + '<p class="note">From <code>' + esc(S.owners.file) + "</code>." + (reviewOff ? ' Code owner review is not turned on yet (see <a href="#setup">Setup left</a>), so today these approvals are not required.' : "") + "</p>";
    }
    if (v === "setup") {
      var items = setupTodo(), done = items.filter(function (i) { return i.done; }).length;
      if (!items.length) return empty("list", "Nothing left", "Every setup step is done.");
      return '<div class="progress"><div class="row3"><span>' + done + " of " + items.length + ' done</span><span>From ONBOARDING.md and open items</span></div><div class="bar"><i style="width:' + Math.round(done / items.length * 100) + '%"></i></div></div>'
        + '<div class="checklist">' + items.map(function (i) { return '<div class="it"><span class="tick' + (i.done ? " done" : "") + '">' + (i.done ? '<svg class="i sm" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 8.3l2.5 2.5L12 5.3"/></svg>' : "") + '</span><div class="tx"><div class="' + (i.done ? "done-t" : "") + '">' + i.html + '</div><div class="sub">' + esc(i.sub) + "</div></div>" + pill(i.done ? "Done" : "To do", i.done ? "green" : "warn") + "</div>"; }).join("") + "</div>";
    }
    return '<div class="diagram-card">' + S.howItWorks + "</div>";
  }

  // ------------------------------------------------------------------ actions
  function api(path, body) {
    return fetch(path, { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json", "X-Rules": "1" }, body: JSON.stringify(body || {}) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || "The workbench refused that."); return j; }); });
  }
  function apply(next) { S = next; }
  function act(path, body, after) {
    ui.busy = true; ui.error = ""; render();
    return api(path, body).then(function (next) { apply(next); ui.busy = false; if (after) after(next); render(); })
      .catch(function (err) { ui.busy = false; ui.error = err.message; render(); });
  }
  function nextUndecided(fromId) {
    var list = shown(), i = list.map(function (x) { return x.id; }).indexOf(fromId);
    for (var k = 1; k <= list.length; k++) { var x = list[(i + k) % list.length]; if (!x.pending && !x.pr) return x.id; }
    return fromId;
  }
  function decide(d) {
    var r = current(); if (!LOCAL || !r || r.pending || r.pr) return;
    var why = (ui.why[r.id] || "").trim(); if (!why) { var t = $("#why"); if (t) t.focus(); return; }
    act("/api/decide", { rule: r.id, decision: d, why: why }, function () { delete ui.why[r.id]; ui.done = null; ui.sel = nextUndecided(r.id); });
  }
  function openDialog() {
    if (!LOCAL || !S.pending.length || ui.busy || ui.dialog) return;
    api("/api/branch", {}).then(function (j) { ui.error = ""; ui.dialog = j.result; render(); var b = $("#branch"); if (b) b.focus(); })
      .catch(function (err) { ui.error = err.message; render(); });
  }
  function move(step) {
    var list = shown(); if (!list.length) return;
    var i = list.map(function (x) { return x.id; }).indexOf(ui.sel);
    ui.sel = list[Math.min(list.length - 1, Math.max(0, i + step))].id; render();
    var b = document.querySelector('[data-pick="' + (window.CSS && CSS.escape ? CSS.escape(ui.sel) : ui.sel) + '"]'); if (b) b.focus();
  }

  document.addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-pick],[data-act],[data-undo],[data-copy],[data-sev]");
    if (!t) return;
    if (t.getAttribute("data-act") !== "discard") ui.confirmDiscard = false;
    if (t.hasAttribute("data-sev")) { ui.sev = t.getAttribute("data-sev"); render(); return; }
    if (t.hasAttribute("data-pick")) { ui.sel = t.getAttribute("data-pick"); ui.error = ""; render(); return; }
    if (t.hasAttribute("data-undo")) { act("/api/undo", { rule: t.getAttribute("data-undo") }); return; }
    if (t.hasAttribute("data-copy")) {
      var txt = document.getElementById(t.getAttribute("data-copy")).textContent;
      var done = function () { t.textContent = "Copied"; setTimeout(function () { t.textContent = "Copy"; }, 1500); };
      if (navigator.clipboard) navigator.clipboard.writeText(txt).then(done, function () {}); return;
    }
    var a = t.getAttribute("data-act");
    if (a === "accept" || a === "reject") decide(a);
    else if (a === "dialog") openDialog();
    else if (a === "discard") {
      if (!ui.confirmDiscard) { ui.confirmDiscard = true; render(); return; }
      ui.confirmDiscard = false; act("/api/discard", {}, function () { ui.done = null; });
    }
    else if (a === "cancel") { ui.dialog = null; ui.error = ""; render(); }
    else if (a === "open") {
      var branch = ($("#branch") || {}).value || ui.dialog.branch;
      ui.dialog.branch = branch;
      act("/api/pr", { branch: branch }, function (next) { ui.dialog = null; ui.done = next.result; });
    }
  });
  document.addEventListener("input", function (ev) {
    if (ev.target.id === "why") { var r = current(); if (r) { ui.why[r.id] = ev.target.value; var can = ev.target.value.trim() && !r.pending && !ui.busy && !(S.stray && S.stray.length);
      document.querySelectorAll('[data-act="accept"],[data-act="reject"]').forEach(function (b) { b.disabled = !can; }); } }
    else if (ev.target.id === "filter") { ui.filter = ev.target.value; render(); }
    else if (ev.target.id === "branch" && ui.dialog) ui.dialog.branch = ev.target.value;
  });
  document.addEventListener("keydown", function (ev) {
    var typing = /^(INPUT|TEXTAREA)$/.test((ev.target && ev.target.tagName) || "");
    if (ev.key === "Escape" && ui.dialog && !ui.busy) { ui.dialog = null; ui.error = ""; render(); return; }
    if (ev.key === "Enter" && (ev.ctrlKey || ev.metaKey) && ui.view === "waiting" && !ui.dialog) { ev.preventDefault(); openDialog(); return; }
    if (typing || ui.dialog || ui.view !== "waiting" || ev.ctrlKey || ev.metaKey || ev.altKey) return;
    if (ev.key === "j" || ev.key === "ArrowDown") { ev.preventDefault(); move(1); }
    else if (ev.key === "k" || ev.key === "ArrowUp") { ev.preventDefault(); move(-1); }
    else if (ev.key === "a" || ev.key === "r") { ev.preventDefault(); decide(ev.key === "a" ? "accept" : "reject"); }
    else if (ev.key === "/") { ev.preventDefault(); var f = $("#filter"); if (f) f.focus(); }
  });
  function route() {
    var v = (location.hash || "").slice(1);
    ui.view = VIEWS.indexOf(v) >= 0 ? v : "waiting";
    render();
  }
  window.addEventListener("hashchange", route);
  if (!S) { document.getElementById("app").innerHTML = '<p style="padding:24px">No data: build this page with rules_app.py.</p>'; return; }
  route();
})();
</script>
</body>
</html>
